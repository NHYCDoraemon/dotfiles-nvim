# ============================================================
# Keybindings
# ============================================================
# Fullscreen — same as Ghostty's super+enter / super+ctrl+f.
map cmd+enter      toggle_fullscreen
map cmd+ctrl+f     toggle_fullscreen

# Splits / window management. `--cwd=current` makes new panes open in the
# same directory as the current one.
map cmd+d        launch --location=vsplit --cwd=current
map cmd+shift+d  launch --location=hsplit --cwd=current
map cmd+w        close_window

# Font size — Cmd+= / Cmd++ zoom in, Cmd+- zoom out, Cmd+0 reset.
# Both `equal` and `plus` (Shift+=) are bound for keyboard-layout safety.
map cmd+equal    change_font_size all +1.0
map cmd+plus     change_font_size all +1.0
map cmd+minus    change_font_size all -1.0
map cmd+0        change_font_size all 0

# Free up ⌘+letter so nvim sees them as <D-x> via kitty keyboard protocol.
# Kitty's defaults intercept ⌘W/T/N/F/etc. — unmap so they pass through.
# (cmd+w and cmd+d are intentionally NOT in this list — they're claimed
# above for splits/close, so nvim won't see them.)
map cmd+t  new_tab_with_cwd
map cmd+n  no_op
map cmd+r  no_op
map cmd+e  no_op
map cmd+l  no_op
map cmd+k  no_op
map cmd+f  no_op
map cmd+b  no_op
map cmd+u  no_op
map cmd+p  no_op
map cmd+j  no_op
map cmd+g  no_op
map cmd+o  no_op
map cmd+y  no_op
map cmd+1  no_op
map cmd+2  no_op
map cmd+3  no_op
map cmd+4  no_op
map cmd+5  no_op
map cmd+6  no_op
map cmd+7  no_op
map cmd+8  no_op
map cmd+9  no_op

# Keep useful Kitty shortcuts that don't collide:
#   ⌘+ / ⌘= / ⌘-     font size up/down
#   ⌘0               reset font size
#   ⌘C / ⌘V          system clipboard copy/paste
#   ⌘Q               quit Kitty (system standard)

# ============================================================
# Hints — grab on-screen targets without reaching for the mouse
# ============================================================
# Kitty's defaults already cover URL/path/hash via ⌃⇧E and ⌃⇧P prefix.
# Adding ⌘-prefixed Mac-native shortcuts so hints feel like first-class
# system actions (consistent with ⌘+f-style pickers in other Mac apps).
#   ⌘⇧E           → URL hint, open in default browser
#   ⌘⇧P then F    → file path, paste into the command line
#   ⌘⇧P then L    → line of text, paste
#   ⌘⇧P then W    → single word, paste
#   ⌘⇧P then H    → git/SHA hash, paste
#   ⌘⇧P then N    → line number from compiler/grep output, paste as :NN
map cmd+shift+e   open_url_with_hints
map cmd+shift+p>f kitten hints --type path     --program -
map cmd+shift+p>l kitten hints --type line     --program -
map cmd+shift+p>w kitten hints --type word     --program -
map cmd+shift+p>h kitten hints --type hash     --program -
map cmd+shift+p>n kitten hints --type linenum

# Theme is inlined above (Catppuccin Mocha, lines 124-157).
# Intentionally NO `BEGIN_KITTY_THEME ... END_KITTY_THEME` block here:
# `kitty +kitten themes` would otherwise rewrite that block on selection
# and silently override the inline palette. To swap themes, edit the
# Mocha section above directly — do NOT use the themes kitten.