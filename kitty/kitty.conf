# Kitty configuration — mirrors ~/.config/ghostty/config 1:1
# in terms of intent. Differences are only because Kitty's directive names
# and value formats differ.
#
# This setup is paired with image.nvim + diagram.nvim in nvim — Kitty's
# native graphics protocol is what makes inline mermaid / png rendering
# actually work (vs flaky Ghostty / Neovide paths).

# ============================================================
# Font
# ============================================================
# To swap font: comment the active `font_family` and uncomment one below,
# then press `ctrl+shift+,` inside kitty to live-reload (or run
# ~/.config/nvim/install.sh --upgrade which sends SIGUSR1).
# All picks are Nerd Font patched (icons survive the swap).
font_family       Liga Comic Mono
# ── 备选 ─────────────────────────────────────────
# font_family     Lilex Nerd Font                # 重 ligature，符号合并多
# font_family     Maple Mono NF                  # modern + CJK-friendly + italic 半连
# font_family     VictorMono Nerd Font           # italic 大小写都是花体
# font_family     Cascadia Code NF               # italic 大小写都连笔
# font_family     Monaspace Radon NF             # 整字符手写感
# font_family     RecMonoCasual Nerd Font        # Casual 轴全开
# font_family     RecMonoSmCasual Nerd Font      # 微微手写
# font_family     Monaspace Argon NF             # humanist 偏端正
italic_font       auto
bold_font         auto
bold_italic_font  auto
font_size         16
disable_ligatures never
font_features     +calt +liga
adjust_line_height 110%

# macOS-only: thicken stroke slightly. Apple's CoreText renders most fonts
# a touch thinner than the original metrics; 0.4 puts a hair of weight back
# without going chunky. 0 = stock, 0.5+ = noticeably bold.
macos_thicken_font 0.4

# CJK → Source Han Sans (思源黑体). Maple Mono NF has no CJK glyphs, so
# without this map kitty auto-falls-back to PingFang.
symbol_map U+3000-U+303F,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+FF00-U+FFEF Source Han Sans VF

# ============================================================
# Window / chrome
# ============================================================
window_padding_width 8
remember_window_size yes
hide_window_decorations no
macos_show_window_title_in window
macos_option_as_alt   left
macos_quit_when_last_window_closed yes
# macos_titlebar_color  background

# Tab bar — only show when 2+ tabs (single-tab keeps chrome clean).
tab_bar_min_tabs   2
tab_bar_edge       bottom
tab_bar_style      separator
tab_separator      " │ "

# Layout — `splits` is required for vsplit/hsplit panes via `launch --location`.
enabled_layouts splits

# ============================================================
# Behavior
# ============================================================
copy_on_select          no
strip_trailing_spaces   smart
enable_audio_bell       no
visual_bell_duration    0.0
# `no-cursor` keeps the rest of shell integration (cwd reporting, jump-to-
# prompt, etc.) but stops zsh/bash from sending DECSCUSR codes that flip
# the cursor to a beam in shell prompts. Without this, kitty's
# cursor_shape below gets overridden whenever you're at a prompt.
shell_integration       enabled no-cursor
allow_remote_control    yes
# listen_on lets `kitty @ ...` from any shell talk to this instance
# (without it, remote-control commands need KITTY_LISTEN_ON env which only
# kitty-spawned children get). The socket gets the kitty PID interpolated
# so multiple kitty instances don't collide.
listen_on               unix:/tmp/mykitty-{kitty_pid}

# Notify when a long-running command finishes — only if the kitty window is
# unfocused (you're elsewhere) and the command ran 10s+. Requires shell
# integration (already enabled above) so kitty can detect prompt boundaries.
notify_on_cmd_finish    unfocused 10.0

# Cursor — block shape, smooth fade-blink, motion trail.
# cursor_blink_interval        positive value = blink. Modern kitty fades
#                              the cursor in/out smoothly between blinks
#                              (not abrupt on/off).
# cursor_stop_blinking_after   stop blinking after N seconds idle (saves
#                              your eyes; press any key to wake it).
# cursor_trail / decay         when cursor moves N+ cells, draw a fading
#                              motion trail behind it.
cursor_shape                  block
cursor_shape_unfocused        hollow
cursor_blink_interval         0.5
cursor_stop_blinking_after    15.0
# Cursor trail tuned aggressive — typing 单字符就能看见拖尾。
#   trail 3                     trail length, in animation steps
#   threshold 1 (was 2)         kick in after even a 1-cell move (typing!)
#   decay 0.15 0.55 (was 0.1 0.4)
#                               longer fade-out so the smear actually lingers
# 这是 kitty 唯一能给的"动效"——真正的打字粒子去 neovide 里 (<leader>uV)
cursor_trail                  3
cursor_trail_decay            0.15 0.55
cursor_trail_start_threshold  1

# ============================================================
# Transparency — macOS 原生 vibrancy + opacity
# ============================================================
# background_opacity: 0~1，越小越透。深色主题阅读容差大，0.85 比浅色 0.88
#   多透一点，桌面壁纸的轮廓刚好能透出，又不抢字
# background_blur:    macOS 原生高斯模糊半径，0 关闭
# dynamic_background_opacity: 允许运行时按 ⌘+Shift+a>m / l 微调
background_opacity         1.0
background_blur            0
dynamic_background_opacity yes

# ============================================================
