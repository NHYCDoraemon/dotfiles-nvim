# Starship prompt — Tokyonight Moon-aligned, two-line, minimalist.
# Palette ref: kitty.conf (Tokyonight Moon). Edit hex codes here and the
# whole prompt re-tones; no oh-my-zsh theme needed.

format = """
[╭─](bold #545c7e) $directory$git_branch$git_status$cmd_duration
[╰─](bold #545c7e)$character """

# Right-side prompt: language/runtime info (only shown if relevant).
right_format = "$nodejs$python$rust$golang$java$lua"

add_newline = true

[character]
success_symbol = "[](bold #c3e88d)"
error_symbol   = "[](bold #ff757f)"
vimcmd_symbol  = "[](bold #c099ff)"

[directory]
style = "bold #82aaff"
truncation_length = 3
truncate_to_repo  = true
read_only = " "
home_symbol = " ~"

[git_branch]
symbol = " "
style = "bold #c099ff"
format = "[on](#828bb8) [$symbol$branch]($style) "

[git_status]
style = "bold #ffc777"
format = "[$all_status$ahead_behind]($style)"
ahead     = "⇡${count} "
behind    = "⇣${count} "
diverged  = "⇕⇡${ahead_count}⇣${behind_count} "
modified  = "● "
staged    = "✚ "
untracked = "? "
stashed   = "≡ "
renamed   = "» "
deleted   = "✘ "

[cmd_duration]
min_time = 2000
style = "bold #ff966c"
format = "took [$duration]($style) "

[nodejs]
symbol = " "
style = "#c3e88d"
format = "[$symbol($version)]($style) "

[python]
symbol = " "
style = "#ffc777"
format = "[${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"

[rust]
symbol = " "
style = "#ff966c"
format = "[$symbol($version)]($style) "

[golang]
symbol = " "
style = "#86e1fc"
format = "[$symbol($version)]($style) "

[java]
symbol = " "
style = "#ff757f"
format = "[$symbol($version)]($style) "

[lua]
symbol = " "
style = "#82aaff"
format = "[$symbol($version)]($style) "
